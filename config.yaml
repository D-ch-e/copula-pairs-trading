# 主規格（pre-registered）：開始回測前固定，之後的變化只當敏感度分析

db_path: data/pairs.sqlite

data:
  start: 2006-05-01
  end: 2025-12-31
  tickers: [GLD, SLV, GDX, GDXJ, XOM, CVX, KO, PEP, SPY]
  french_daily_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_Factors_daily_CSV.zip

pairs:
  main: [GLD, SLV]
  robustness:
    - [GDX, GDXJ]
    - [XOM, CVX]
    - [KO, PEP]

benchmarks: [SPY, GLD]

strategy:
  estimation_window_days: 252   # 12 個月
  refit: monthly                # 每月重估 copula
  alpha: 0.05                   # 條件機率信賴帶
  family: t                     # t 或 gaussian
  exit_band: 0.5                # h1、h2 都回到 0.5 另一側時出場；null 停用
  take_profit: null             # 交易累積報酬達此值出場；null 停用（敏感度用）
  max_holding_days: 20
  stop_loss: -0.05
  execution_lag_days: 1         # 一日等待
  exit_rule: probability        # probability（主規格）或 paper_quantile

# 第二規格（2026-10-24 在看到其結果前登記）：Krauss & Stübinger 的出場規則
# 每月在估計視窗內對每個訊號追蹤 max_holding_days 天的累積報酬路徑，
# TP = 各路徑 95% 分位數平均，SL = 各路徑 10% 分位數平均；不使用 exit_band。
paper_quantile:
  take_profit_quantile: 0.95
  stop_loss_quantile: 0.10

# Baseline：z-score 價差策略（同視窗、同成本、同 $1/$1 部位）
zscore:
  entry: 2.0                    # |z| > 2 進場
  exit: 0.0                     # z 穿越 0 出場

costs:
  round_trip_bps: 50
  sensitivity_bps: [0, 10, 25, 50, 100]

# 子期間（2026-10-26 在看子期間結果前登記；日期依外部事件定義，不依策略表現挑選）
subperiods:
  gfc_2008:
    label: Global financial crisis
    start: 2007-12-01             # NBER 衰退期 2007-12 → 2009-06
    end: 2009-06-30
  silver_2011:
    label: Silver boom and bust
    start: 2011-01-01             # 白銀 2011-04 創高後崩跌
    end: 2011-12-31
  covid_2020:
    label: COVID shock
    start: 2020-02-01
    end: 2020-12-31
  rates_2022:
    label: Rate-hike cycle
    start: 2022-01-01
    end: 2022-12-31

seed: 42
